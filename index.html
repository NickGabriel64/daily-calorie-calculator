<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calorie Calculator</title>
</head>
<body>
  <h1>Daily Calorie Calculator</h1>

  <div>
    <label for="weight">Weight (lbs)</label>
    <input type="number" id="weight">
  </div>
  <div>
    <label for="height">Height (in)</label>
    <input type="number" id="height">
  </div>
  <div>
    <label for="age">Age</label>
    <input type="number" id="age">
  </div>
  <div>
    <label for="sex">Sex</label>
    <select id="sex">
      <option value="male">male</option>
      <option value="female">female</option>
    </select>
  </div>
  <div>
  <label for="steps">Steps today (Separate from other activities) (optional)</label>
  <input type="number" id="steps">
  </div>
  <div>
  <label for="grade">Grade of steps taken (%) (optional)</label>
  <input type="number" id="grade" min="0" max="25" step="0.5" value="0">
</div>
  <div>
    <label for="timeRan">Time Running (minutes) (optional)</label>
    <input type="number" id="timeRan" min="0" value="0">
  </div>
  <div>
    <label for="runMph">Speed while running (MPH) (optional)</label>
    <input type="number" id="runMph" min="0" step=".1" value="0">
  </div>
  <div>
    <label for="timeLifted">Time Lifting (minutes) (optional)</label>
    <input type="number" id="timeLifted" min="0" value="0">
  </div>
<div>
    <label for="liftIntensity">Lift Intensity</label>
    <select id="liftIntensity">
      <option value="light">light</option>
      <option value="moderate">moderate</option>
      <option value="vigorous">vigorous</option>
      <option value="very high intensity">very high intensity</option>
    </select>
  </div>


  <h2>Daily activities (minutes, optional)</h2>
  <div>
    <label for="act-standing">Standing</label>
    <input type="number" id="act-standing" class="activity-input"
           data-activity="standing" min="0" value="0">
  </div>
  <div>
    <label for="act-light">Physical labor (light)</label>
    <input type="number" id="act-light" class="activity-input"
           data-activity="physical labor (light)" min="0" value="0">
  </div>
  <div>
    <label for="act-moderate">Physical labor (moderate)</label>
    <input type="number" id="act-moderate" class="activity-input"
           data-activity="physical labor (moderate)" min="0" value="0">
  </div>
  <div>
    <label for="act-heavy">Physical labor (heavy)</label>
    <input type="number" id="act-heavy" class="activity-input"
           data-activity="physical labor (heavy)" min="0" value="0">
  </div>


  <button id="calculate">Calculate</button>
  <p id="result"></p>

  <script src="calculatorfns.js"></script>
  <script src="app.js"></script>
</body>
</html>
